          zz/25/8Ba2gpSwAIAgA=
          INVENTORY_TOOLING_PAYLOAD
          ACTUAL=$(sha256sum < "$RUNNER_TEMP/inventory-tooling.tgz" | cut -d' ' -f1)
          if [ "$ACTUAL" != "7c73e7c507e13f6de8be37b2bd4a99358e09252273c4587982e26d8519675f86" ]; then
            echo "::error::embedded payload digest mismatch: expected 7c73e7c507e13f6de8be37b2bd4a99358e09252273c4587982e26d8519675f86, got $ACTUAL"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/inventory-tooling.tgz" -C "$TOOLS"
          python3 -c "import ast,pathlib,sys; ns=sorted(pathlib.Path(sys.argv[1]).glob('*.py')); [ast.parse(p.read_text()) for p in ns]; print('tooling parses:', ', '.join(p.name for p in ns))" "$TOOLS/tools"

      - name: Discover platform and deployables
        id: d
        run: |
          python3 "$TOOLS/tools/discover_deployables.py" \
            --root . --platform "$PLATFORM_IN" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.d.outputs.platform == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ steps.d.outputs.node_version_file }}
          # setup-node hard-fails with "Dependencies lock file is not found" when caching is on
          # and no lockfile exists — before the continue-on-error install, so a lockfile-less Node
          # repo would publish nothing at all rather than a report with a recorded gap.
          cache: ${{ (hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') != '') && 'npm' || '' }}

      # The CodeGraph and Claude CLIs are npm-installed, so Node must exist even on a .NET repo —
      # but only when analysis is enabled, since both installs are gated on it and the
      # deterministic pass for a .NET repo is python and dotnet only.
      - name: Setup Node.js (for tooling)
        if: ${{ steps.d.outputs.platform != 'node' && github.event.inputs.enable_analysis == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup .NET
        if: steps.d.outputs.platform == 'dotnet'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ steps.d.outputs.dotnet_version }}

      # GITHUB_TOKEN reads org packages for both ecosystems — no PAT, nothing to rotate. A failure
      # here degrades the inventory (licence and vulnerability layers) rather than failing the run.
      - name: Install dependencies (node)
        if: steps.d.outputs.platform == 'node'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --ignore-scripts: this pass only reads manifests, the lockfile and audit/licence data,
        # so no dependency needs to build. Without it a compromised package's postinstall runs
        # with GH_TOKEN in the environment, which this job holds at contents: write.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Restore dependencies (dotnet)
        if: steps.d.outputs.platform == 'dotnet'
        continue-on-error: true
        run: |
          # --store-password-in-clear-text writes the token into ~/.nuget/NuGet/NuGet.Config.
          # The default shell is `bash -e`, so a failing restore would skip the cleanup and leave
          # it there for the rest of the job. A trap removes it on any exit path.
          trap 'dotnet nuget remove source gh-inventory >/dev/null 2>&1 || true' EXIT
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text --name gh-inventory
          dotnet restore

      # The rolling release is also the state store: the previous run's findings are pulled from
      # it to compute new/resolved, so that signal does not depend on artifact retention.
      # Ephemeral index of this checkout, discarded with the job. Never written to the service
      # repository, and a repo having no index of its own is not a finding. Gated on analysis
      # because the index has exactly one consumer: the model, through codegraph_explore.
      - name: Build CodeGraph index
        if: ${{ github.event.inputs.enable_analysis == 'true' }}
        continue-on-error: true
        run: |
          npm install -g @colbymchenry/codegraph
          codegraph init .

      - name: Install Claude CLI
        if: ${{ github.event.inputs.enable_analysis == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch previous findings from the rolling release
        run: |
          mkdir -p "$OUT/prior"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --dir "$OUT/prior" --pattern 'findings-*.json' || true
          fi
          echo "prior findings available: $(ls "$OUT/prior" 2>/dev/null | wc -l)"

      - name: Inventory each deployable
        env:
          DEPLOYABLES_JSON: ${{ steps.d.outputs.deployables }}
        run: |
          set -euo pipefail
          # A run with no deployables still publishes summary.md and meta.json, and the loop below
          # never executes -- so nothing would create this directory and the metadata step would
          # die on a missing path, before the release is even claimed.
          mkdir -p "$OUT/publish"
          # Through the environment, never interpolated into the script. A deployable name is
          # derived from a directory name; one containing a quote would otherwise close the shell
          # literal, at best breaking the step and at worst injecting shell.
          printf '%s' "$DEPLOYABLES_JSON" \
            | python3 -c 'import json,sys; [print(json.dumps(d)) for d in json.load(sys.stdin)]' \
            > "$OUT/deployables.jsonl"

          while IFS= read -r D; do
            NAME=$(printf '%s' "$D" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            WORK="$OUT/work/$NAME"; mkdir -p "$WORK"
            echo "::group::$NAME"

            python3 "$TOOLS/tools/collect.py" \
              --root . --platform '${{ steps.d.outputs.platform }}' \
              --deployable "$D" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --out "$WORK/collected.json"

            AGENT=()
            if [ "$ANALYSIS" = 'true' ]; then
              if python3 "$TOOLS/tools/run_analysis.py" \
                   --tools "$TOOLS" --root . --platform '${{ steps.d.outputs.platform }}' \
                   --deployable "$D" --collected "$WORK/collected.json" \
                   --task-timeout "$TASK_TIMEOUT" \
                   --out "$WORK/agent-findings.json"; then
                AGENT=(--agent "$WORK/agent-findings.json")
              else
                # SPEC.md section 5: a requested stage that cannot run is an operator error, not
                # a condition to degrade around. run_analysis exits non-zero only when it cannot
                # authenticate or crashes — every task-level failure is absorbed internally and
                # still exits 0 — so this repeats identically every run rather than being flaky.
                #
                # Fail here, before anything is published. Publishing a document without the half
                # that was asked for would overwrite a complete one under the same name, archive
                # the thin version as this commit's permanent record, and hand the next run a
                # degraded baseline. Publishing nothing leaves the previous inventory in place,
                # visibly stale, which is recoverable.
                echo "::error::analysis was requested for $NAME but could not run; check that an" \
                     "authenticated claude CLI is on PATH. Nothing has been published."
                exit 1
              fi
            fi

            PRIOR=()
            [ -f "$OUT/prior/findings-$NAME.json" ] && PRIOR=(--prior "$OUT/prior/findings-$NAME.json")
            BASE=()
            [ -f .github/service-inventory-baseline.json ] \
              && BASE=(--baseline .github/service-inventory-baseline.json)

            # Degrade rather than fail. Without this, one deployable's render error kills the step
            # under `set -e`, the publish step never runs, and NOTHING is published — including
            # deployables that already rendered.
            if python3 "$TOOLS/tools/build_report.py" \
                 --collected "$WORK/collected.json" \
                 ${AGENT[@]+"${AGENT[@]}"} ${PRIOR[@]+"${PRIOR[@]}"} ${BASE[@]+"${BASE[@]}"} \
                 --provenance ci --out-dir "$OUT/publish"; then
              cat "$OUT/publish/summary.md" >> "$OUT/summary-all.md"
            else
              echo "::warning::render failed for $NAME — other deployables are unaffected"
              echo "### \`$NAME\` — **render failed**, no report produced" >> "$OUT/summary-all.md"
              echo "$NAME" >> "$OUT/failed-deployables.txt"
            fi
            echo >> "$OUT/summary-all.md"
            echo "::endgroup::"
          done < "$OUT/deployables.jsonl"

          # build_report writes summary.md per deployable into the same directory, so the last
          # one overwrites the rest -- and that single-service file is what gets published as the
          # release's shared summary and archived permanently. summary-all.md is what accumulated
          # every deployable's diff; publish that instead.
          if [ -s "$OUT/summary-all.md" ]; then
            cp "$OUT/summary-all.md" "$OUT/publish/summary.md"
          fi

      - name: Write metadata
        env:
          DEPLOYABLES_JSON: ${{ steps.d.outputs.deployables }}
        run: |
          printf '{"repo":"%s","sha":"%s","ref":"%s","runId":"%s","builtAt":"%s","toolingRef":"%s","deployables":%s}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'b0d5c91' \
            "$DEPLOYABLES_JSON" > "$OUT/publish/meta.json"

      # SPEC.md D1-D11. One current release holding the rolling inventory, and a sequence of
      # archive releases that are only ever appended to. Nothing is committed to the branch that
      # built it — which would churn the SHA and can loop.
      - name: Publish as rolling release asset
        env:
          # Whether discovery was overridden rather than run. A deployable left out of an override
          # has not been removed from the repository, so such a run is not authoritative (D4).
          OVERRIDDEN: ${{ steps.d.outputs.overridden }}
        run: |
          set -euo pipefail

          # D1 — a release is ours only if its body carries the marker. Checked for every release
          # this run writes to, current and archive alike. A body edited through the web UI comes
          # back CRLF-terminated, and grep -x will not match a line ending in CR.
          MARKER='<!-- managed-by: svh-service-inventory -->'
          NOTES="Rolling service inventory — outbound calls, inbound surface, and bill of materials.
          Auto-updated on merge; not a source release."

          claim() {
            # $1 = tag, $2 = title. Exits 78 if the release exists and is not ours.
            local BODY
            if BODY=$(gh release view "$1" --json body --jq .body 2>/dev/null); then
              # Strip the carriage returns a web-UI edit leaves, and the leading and trailing
              # whitespace a human typing into that textarea leaves with them. The marker must
              # still be a line of its own -- not text embedded in a sentence -- but requiring it
              # to be byte-exact rejects the very edit D1 offers as the remedy for exit 78.
              printf '%s\n' "$BODY" | tr -d '\r' \
                | sed 's/^[[:space:]]*//; s/[[:space:]]*$//' > "$OUT/body.txt"
              if ! grep -qxF "$MARKER" "$OUT/body.txt"; then
                echo "::error::NOTHING WAS CHANGED — release $1 was not created by this workflow," \
                     "so it was left completely alone: nothing read, nothing written, nothing" \
                     "deleted. Publishing to a release this workflow does not own could destroy" \
                     "somebody else's assets. To use it anyway, add the line $MARKER to the" \
                     "release body. Otherwise point release_tag at a different tag."
                exit 78
              fi
              return 0
            fi
            printf '%s\n\n%s\n' "$NOTES" "$MARKER" > "$OUT/release-notes.md"
            gh release create "$1" --title "$2" --notes-file "$OUT/release-notes.md" --latest=false
          }

          claim "$TAG" "Service inventory"

          # D10 — a deployable that failed to render may have left a partly-written file behind.
          # Publishing it would put a truncated report on the stable link and into that commit's
          # permanent record, while the run reports it as not published.
          if [ -f "$OUT/failed-deployables.txt" ]; then
            while IFS= read -r FAILED_NAME; do
              [ -n "$FAILED_NAME" ] || continue
              rm -f "$OUT/publish/service-inventory-$FAILED_NAME.md" \
                    "$OUT/publish/findings-$FAILED_NAME.json"
            done < "$OUT/failed-deployables.txt"
          fi

          # D2 — an immutable copy of each file, keyed to this commit. The archive- PREFIX is
          # load-bearing: the previous findings are fetched with --pattern 'findings-*.json', and a
          # suffix scheme would be caught by that glob and feed the whole archive back as the prior.
          rm -rf "$OUT/archive"
          mkdir -p "$OUT/archive"
          for f in "$OUT"/publish/*; do
            [ -e "$f" ] || continue
            cp "$f" "$OUT/archive/archive-$GITHUB_SHA-$(basename "$f")"
          done

          # D4 — authority. Only an authoritative run may conclude a deployable is GONE rather than
          # merely absent from this run. Being at the head is a weaker, separate condition (D8).
          AUTHORITATIVE=1
          IS_HEAD=0
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" \
                       --jq .commit.sha 2>/dev/null || true)
          if [ -z "$HEAD_SHA" ]; then
            echo "::warning::head of $GITHUB_REF_NAME could not be determined; retiring nothing"
            AUTHORITATIVE=0
          elif [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::not the head of $GITHUB_REF_NAME; retiring nothing"
            AUTHORITATIVE=0
          else
            IS_HEAD=1
          fi
          if [ -f "$OUT/failed-deployables.txt" ]; then
            echo "::notice::a deployable did not render; retiring nothing"
            AUTHORITATIVE=0
          fi
          if [ "${OVERRIDDEN:-0}" = "1" ]; then
            echo "::notice::deployables were overridden; retiring nothing"
            AUTHORITATIVE=0
          fi
          echo "::notice::authoritative=$AUTHORITATIVE"

          # One place where anything is deleted. A refusal is handled identically wherever it
          # happens, and the count stays honest (I7).
          DELETED=0
          delete_asset() {
            if gh release delete-asset "$TAG" "$1" --yes; then
              DELETED=$((DELETED+1))
              return 0
            fi
            # One retry: the failure this guards against is secondary rate limiting on a burst,
            # which clears on its own.
            sleep 5
            if gh release delete-asset "$TAG" "$1" --yes; then
              DELETED=$((DELETED+1))
              return 0
            fi
            echo "::warning::could not delete $1"
            return 1
          }

          # D5 — the ONLY deletion this workflow performs. Current names this run did not produce
          # belong to deployables that are gone. No ownership test is needed: on a release this
          # workflow owns, an unexpected current name is an earlier run's leftover. Each current
          # name stands alone, so a failed delete leaves nothing half-done.
          if [ "$AUTHORITATIVE" = "1" ]; then
            find "$OUT/publish" -type f -exec basename {} \; | sort > "$OUT/current-names.txt"
            gh release view "$TAG" --json assets --jq '.assets[].name' > "$OUT/on-release.txt"
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              case "$NAME" in
                service-inventory-*.md|findings-*.json|summary.md|meta.json) ;;
                *) continue ;;    # not a shape this workflow publishes (D2); leave it alone
              esac
              grep -qxF "$NAME" "$OUT/current-names.txt" && continue
              echo "::notice::retiring $NAME — this run no longer produces it"
              delete_asset "$NAME" || true
            done < "$OUT/on-release.txt"
            [ "$DELETED" -eq 0 ] || echo "::notice::retired $DELETED asset(s) no longer produced"
          fi

          # D8 — only the branch head writes the current names: the stable link points at the head,
          # not at whatever commit most recently finished a run (I5).
          if [ "$IS_HEAD" = "1" ]; then
            CURRENT_COUNT=$(find "$OUT/publish" -type f | wc -l | tr -d ' ')
            ON_RELEASE=$(gh release view "$TAG" --json assets --jq '.assets | length')
            if [ "$((ON_RELEASE + CURRENT_COUNT))" -gt 1000 ]; then
              echo "::error::NOTHING WAS CHANGED — the current release cannot hold this" \
                   "repository's inventory: $ON_RELEASE asset(s) are on $TAG and this run" \
                   "publishes $CURRENT_COUNT, over GitHub's 1000-asset limit. Nothing was" \
                   "uploaded. This repository has more deployables than one release can carry;" \
                   "split them across more than one release_tag."
              exit 75
            fi
            gh release upload "$TAG" "$OUT"/publish/* --clobber
            echo "::notice::published $CURRENT_COUNT file(s) to $TAG"
          else
            echo "::notice::not the branch head; recording this commit's archive and leaving the" \
                 "current inventory pointing at the head"
          fi

          # D6 — a commit is recorded ONCE. The archive is immutable, so before choosing where to
          # write, ask whether this commit is already recorded anywhere in the sequence. Checking
          # only the release picked after a rollover wrote the same commit to two releases: a
          # re-run found the latest release full, started the next, found it empty, and duplicated
          # the record it already had.
          ARCHIVE_TAGS=$(gh release list --limit 1000 --json tagName --jq '.[].tagName' \
                         2>/dev/null | grep "^$TAG-archive-" | sort || true)
          RECORDED=""
          # Unquoted on purpose: the tags are newline-separated and match [A-Za-z0-9._-], so
          # word-splitting them is the intent.
          # shellcheck disable=SC2086
          for T in $ARCHIVE_TAGS; do
            if gh release view "$T" --json assets --jq '.assets[].name' 2>/dev/null \
               | grep -q "^archive-$GITHUB_SHA-"; then
              RECORDED="$T"
              break
            fi
          done

          if [ -n "$RECORDED" ]; then
            echo "::notice::archive-$GITHUB_SHA-* is already recorded on $RECORDED;" \
                 "the archive is immutable, so this run adds nothing to it"
          else
            # Append to the highest-numbered release, starting the next when this commit's members
            # will not fit. A commit's members always land on ONE release: a commit split across
            # two is a record that cannot be read back whole.
            ARCHIVE_COUNT=$(find "$OUT/archive" -type f | wc -l | tr -d ' ')
            SEQ=$(echo "$ARCHIVE_TAGS" | sed "s/^$TAG-archive-//" \
                  | grep -E '^[0-9]{4}$' | sort -n | tail -1 || true)
            [ -n "$SEQ" ] || SEQ=0
            NEXT=$(printf '%04d' "$((10#$SEQ + 1))")
            if [ "$SEQ" = "0" ]; then
              ARCHIVE_TAG="$TAG-archive-$NEXT"
              claim "$ARCHIVE_TAG" "Service inventory archive $NEXT"
            else
              ARCHIVE_TAG="$TAG-archive-$(printf '%04d' "$((10#$SEQ))")"
              claim "$ARCHIVE_TAG" "Service inventory archive $SEQ"
              HELD=$(gh release view "$ARCHIVE_TAG" --json assets --jq '.assets | length')
              if [ "$((HELD + ARCHIVE_COUNT))" -gt "$ARCHIVE_SIZE" ]; then
                ARCHIVE_TAG="$TAG-archive-$NEXT"
                echo "::notice::$ARCHIVE_TAG started; $ARCHIVE_SIZE reached on the previous one"
                claim "$ARCHIVE_TAG" "Service inventory archive $NEXT"
              fi
            fi
            gh release upload "$ARCHIVE_TAG" "$OUT"/archive/*
            echo "::notice::recorded $ARCHIVE_COUNT archive file(s) for $GITHUB_SHA on $ARCHIVE_TAG"
          fi

          # D9, D10 — a deployable that did not render produced no files and was never in the
          # publish set. Name it and exit 70: what was produced is published, and the run is not a
          # success.
          if [ -f "$OUT/failed-deployables.txt" ]; then
            FAILED=$(tr '\n' ' ' < "$OUT/failed-deployables.txt")
            echo "::error::these deployables did not render and were not published: $FAILED"
            exit 70
          fi

      # Convenience copy attached to the run. The release asset above is the durable record.
      - name: Upload run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-inventory
          path: ${{ env.OUT }}/publish/

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Service inventory"
            echo
            echo "Published to release \`$TAG\` — [assets](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            echo
            cat "$OUT/summary-all.md" 2>/dev/null || echo "_no summary produced_"
          } >> "$GITHUB_STEP_SUMMARY"
