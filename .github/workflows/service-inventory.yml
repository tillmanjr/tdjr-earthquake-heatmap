          U0F0IXrnlSDyuV3bFTJNzDAfawhLsXzwdicS+l739Od2vi1p89aPe9+HHRQa+nj/+T8ZcPq4LCb1
          odGk1b8balXiIcXbcO94RK1921NAT8LKUNXzE9m6A1NRtvHvsKcthBUTIVgKZ5jB4+y9cJHZNxkw
          kb16GNjIw6RznRLO+aK2gskond61hOaEZkbsasXZfeRFRayb/ga72uY3To6O0otT+047VZv4zLlX
          +elK47m+ofr/yMeuipntFh85hdXuFnSTAuAqKOPBuaNsXDf16ql0h6P7JqE8Q1DNg6E8ORSrdxbr
          Vw95KoAKE6qeaJ4v8X0ko2uDV4yejBRPIxqVwBNeLMgouylDG6Hy4amqZiSGkeqCJOT0oVV3qAnY
          Cs8d2Fb9RB1icO02jK49tU1hymakkX5kp7blumEh4CmALxJHFfqNyIq+IDY2OGz8AkrQ+FLrW6QL
          G1rTaXirQO7ktq05HJKPywWq880g1Lz1e9gujF0RzUativAHXfpgxW2S+cU4RCbZiI70+bq+Q90R
          KTD7rbPojCy60pWudKUrXelKV7rSla50pStd6UpXutKV/2f5C+5oiNcAkAEA
          INVENTORY_TOOLING_PAYLOAD
          ACTUAL=$(sha256sum < "$RUNNER_TEMP/inventory-tooling.tgz" | cut -d' ' -f1)
          if [ "$ACTUAL" != "f69dd188e4e44cd35906af6468999e280b059e92d77d6b1339db6a520c08fb40" ]; then
            echo "::error::embedded payload digest mismatch: expected f69dd188e4e44cd35906af6468999e280b059e92d77d6b1339db6a520c08fb40, got $ACTUAL"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/inventory-tooling.tgz" -C "$TOOLS"
          python3 -c "import ast,pathlib,sys; ns=sorted(pathlib.Path(sys.argv[1]).glob('*.py')); [ast.parse(p.read_text()) for p in ns]; print('tooling parses:', ', '.join(p.name for p in ns))" "$TOOLS/tools"

      - name: Discover platform and deployables
        id: d
        run: |
          python3 "$TOOLS/tools/discover_deployables.py" \
            --root . --platform "$PLATFORM_IN" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.d.outputs.platform == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ steps.d.outputs.node_version_file }}
          # setup-node hard-fails with "Dependencies lock file is not found" when caching is on
          # and no lockfile exists — before the continue-on-error install, so a lockfile-less Node
          # repo would publish nothing at all rather than a report with a recorded gap.
          cache: ${{ (hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') != '') && 'npm' || '' }}

      - name: Setup .NET
        if: steps.d.outputs.platform == 'dotnet'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ steps.d.outputs.dotnet_version }}

      # GITHUB_TOKEN reads org packages for both ecosystems — no PAT, nothing to rotate. A failure
      # here degrades the inventory (licence and vulnerability layers) rather than failing the run.
      - name: Install dependencies (node)
        if: steps.d.outputs.platform == 'node'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --ignore-scripts: this pass only reads manifests, the lockfile and audit/licence data,
        # so no dependency needs to build. Without it a compromised package's postinstall runs
        # with GH_TOKEN in the environment, which this job holds at contents: write.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Restore dependencies (dotnet)
        if: steps.d.outputs.platform == 'dotnet'
        continue-on-error: true
        run: |
          # --store-password-in-clear-text writes the token into ~/.nuget/NuGet/NuGet.Config.
          # The default shell is `bash -e`, so a failing restore would skip the cleanup and leave
          # it there for the rest of the job. A trap removes it on any exit path.
          trap 'dotnet nuget remove source gh-inventory >/dev/null 2>&1 || true' EXIT
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text --name gh-inventory
          dotnet restore

      # The rolling release is also the state store: the previous run's findings are pulled from
      # it to compute new/resolved, so that signal does not depend on artifact retention.
      - name: Fetch previous findings from the rolling release
        run: |
          mkdir -p "$OUT/prior"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --dir "$OUT/prior" --pattern 'findings-*.json' || true
          fi
          echo "prior findings available: $(ls "$OUT/prior" 2>/dev/null | wc -l)"

      - name: Inventory each deployable
        env:
          DEPLOYABLES_JSON: ${{ steps.d.outputs.deployables }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/publish"
          # Through the environment, never interpolated into the script. A deployable name is
          # derived from a directory name; one containing a quote would otherwise close the shell
          # literal, at best breaking the step and at worst injecting shell.
          printf '%s' "$DEPLOYABLES_JSON" \
            | python3 -c 'import json,sys; [print(json.dumps(d)) for d in json.load(sys.stdin)]' \
            > "$OUT/deployables.jsonl"

          while IFS= read -r D; do
            NAME=$(printf '%s' "$D" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            WORK="$OUT/work/$NAME"; mkdir -p "$WORK"
            echo "::group::$NAME"

            python3 "$TOOLS/tools/collect.py" \
              --root . --platform '${{ steps.d.outputs.platform }}' \
              --deployable "$D" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --out "$WORK/collected.json"

            PRIOR=()
            [ -f "$OUT/prior/findings-$NAME.json" ] && PRIOR=(--prior "$OUT/prior/findings-$NAME.json")
            BASE=()
            [ -f .github/service-inventory-baseline.json ] \
              && BASE=(--baseline .github/service-inventory-baseline.json)

            # Degrade rather than fail. Without this, one deployable's render error kills the step
            # under `set -e`, the publish step never runs, and NOTHING is published — including
            # deployables that already rendered.
            if python3 "$TOOLS/tools/build_report.py" \
                 --collected "$WORK/collected.json" \
                 ${PRIOR[@]+"${PRIOR[@]}"} ${BASE[@]+"${BASE[@]}"} \
                 --provenance ci --out-dir "$OUT/publish"; then
              cat "$OUT/publish/summary.md" >> "$OUT/summary-all.md"
            else
              echo "::warning::render failed for $NAME — other deployables are unaffected"
              echo "### \`$NAME\` — **render failed**, no report produced" >> "$OUT/summary-all.md"
              echo "$NAME" >> "$OUT/failed-deployables.txt"
            fi
            echo >> "$OUT/summary-all.md"
            echo "::endgroup::"
          done < "$OUT/deployables.jsonl"

      - name: Write metadata
        env:
          DEPLOYABLES_JSON: ${{ steps.d.outputs.deployables }}
        run: |
          printf '{"repo":"%s","sha":"%s","ref":"%s","runId":"%s","builtAt":"%s","toolingRev":"%s","deployables":%s}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'b7820b1' \
            "$DEPLOYABLES_JSON" > "$OUT/publish/meta.json"

      # One fixed tag reused every run, assets overwritten in place, never marked latest, and
      # nothing committed to the branch that built it — which would churn the SHA and can loop.
       # SPEC.md D1, D2, D9, D10. One fixed tag reused every run, assets overwritten in place,
      # never marked latest, and nothing committed to the branch that built it — which would churn
      # the SHA and can loop.
      - name: Publish as rolling release asset
        run: |
          set -euo pipefail

          # D1 — claim the release. The marker lives in the body rather than in an asset: it cannot
          # be pruned, costs nothing against the asset cap, and a human looking at the release can
          # see it. A release without it was not created here, so this run will not touch it, and
          # every later step may assume every asset present is one this workflow put there.
          MARKER='<!-- managed-by: svh-service-inventory -->'
          if BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null); then
            if ! printf '%s\n' "$BODY" | grep -qxF "$MARKER"; then
              echo "::error::release $TAG was not created by this workflow, so publishing to it" \
                   "could destroy assets it does not own. Point release_tag at a tag this workflow" \
                   "owns, or add the line $MARKER to the release body to adopt it deliberately."
              exit 78
            fi
          else
            printf '%s\n%s\n\n%s\n' \
              "Rolling service inventory — outbound calls, inbound surface, and bill of materials." \
              "Auto-updated on merge; not a source release." \
              "$MARKER" > "$OUT/release-notes.md"
            gh release create "$TAG" \
              --title "Service inventory" \
              --notes-file "$OUT/release-notes.md" \
              --latest=false
          fi

          # D2 — an immutable copy of each file, keyed to this commit. The archive- PREFIX is
          # load-bearing: the previous findings are fetched with --pattern 'findings-*.json', and a
          # suffix scheme would be caught by that glob, feeding the whole archive back as the prior.
          rm -rf "$OUT/archive"
          mkdir -p "$OUT/archive"
          for f in "$OUT"/publish/*; do
            [ -e "$f" ] || continue
            cp "$f" "$OUT/archive/archive-$GITHUB_SHA-$(basename "$f")"
          done

          # D9 — current names first; they are the stable link a reader follows.
          gh release upload "$TAG" "$OUT"/publish/* --clobber
          gh release upload "$TAG" "$OUT"/archive/* --clobber
          echo "::notice::published $(find "$OUT/publish" -type f | wc -l | tr -d ' ') file(s)," \
               "archived as archive-$GITHUB_SHA-*"

          # D10, D11 — a deployable that did not render produced no files, so it was never in the
          # publish set. Name it and exit 70: what was produced is published, and the run is not a
          # success. Reported after the upload because the upload is what the run is for.
          if [ -f "$OUT/failed-deployables.txt" ]; then
            FAILED=$(tr '\n' ' ' < "$OUT/failed-deployables.txt")
            echo "::error::these deployables did not render and were not published: $FAILED"
            exit 70
          fi

      # Convenience copy attached to the run. The release asset above is the durable record.
      - name: Upload run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-inventory
          path: ${{ env.OUT }}/publish/

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Service inventory"
            echo
            echo "Published to release \`$TAG\` — [assets](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            echo
            cat "$OUT/summary-all.md" 2>/dev/null || echo "_no summary produced_"
          } >> "$GITHUB_STEP_SUMMARY"
