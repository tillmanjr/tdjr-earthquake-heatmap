#
# Copy this single file into a service repository as
# `.github/workflows/service-inventory.yml`. Nothing else is required: no other files, no
# reusable-workflow reference, no cross-repo checkout, no PAT, no org settings, no secrets. The
# inventory tooling travels inside this file and is unpacked into the runner's temp directory.
#
# It carries:
#   rules/RULES.md
#   tools/build_report.py
#   tools/collect.py
#   tools/discover_deployables.py
#   tools/prune_release_assets.py
#   tools/render_findings.py
#   tools/run_analysis.py
#
# This is the DETERMINISTIC pass only — same commit, same findings. It never invokes a model, so
# it needs no ANTHROPIC_API_KEY and installs nothing globally. The judgement pass is not
# reproducible and is run from the tooling repository instead.
#
# To update, regenerate from the tooling repository rather than editing here — a hand edit is lost
# on the next regeneration, and in the meantime the payload disagrees with the digest above.
#
# The only line intended to be changed after copying is the branch list under `on.push`.
# ---------------------------------------------------------------------------------------------

on:
  push:
    branches: [ main, master, dev ]
  workflow_dispatch:
    inputs:
      platform:
        description: 'node | dotnet | auto'
        type: string
        default: 'auto'
      retention_target:
        description: 'Asset count the release is pruned back to. Below the hard cap of 1000.'
        type: string
        default: '950'
      enable_analysis:
        description: 'Add the model pass. Off by default: a run is deterministic and needs no key'
        type: boolean
        default: false
      task_timeout:
        description: 'Per-question ceiling for the analyse stage, seconds'
        type: string
        default: '180'

# Runs are serialised per repository. The rolling release is also the prior-findings state store,
# so two overlapping runs would each read the same prior, then interleave their --clobber uploads
# — leaving a release whose report, findings and metadata come from different commits, and a
# new/resolved diff computed against a stale baseline. cancel-in-progress is false because the
# later commit's inventory is still wanted; it just has to wait its turn.
concurrency:
  group: service-inventory-${{ github.repository }}
  cancel-in-progress: false

permissions:
  contents: write        # the rolling release asset; nothing is committed to the repo
  packages: read         # the org npm scope and the GitHub Packages NuGet feed.
                         # Declaring `permissions` sets every unlisted scope to `none`, so
                         # without this the installs 403 and — being continue-on-error — degrade
                         # silently rather than failing, producing a thin inventory every run.

jobs:
  inventory:
    runs-on: ubuntu-latest
    # Outer bound. A run that reaches this is hung, not slow: the deterministic pass finishes in
    # seconds once dependencies are installed.
    timeout-minutes: 20
    env:
      # Only contexts GitHub allows in a job-level `env:` — github, needs, strategy, matrix, vars,
      # secrets, inputs. `runner` is NOT among them: `${{ runner.temp }}` here is a workflow
      # validation error and fails the run at startup with no log. TOOLS and OUT are therefore
      # exported from the first step below, via $GITHUB_ENV, where $RUNNER_TEMP does exist.
      GH_TOKEN: ${{ github.token }}
      TAG: service-inventory
      PLATFORM_IN: ${{ github.event.inputs.platform || 'auto' }}
      RETENTION_TARGET: ${{ github.event.inputs.retention_target || '950' }}
      ANALYSIS: ${{ github.event.inputs.enable_analysis || 'false' }}
      TASK_TIMEOUT: ${{ github.event.inputs.task_timeout || '180' }}
    steps:
      - name: Checkout service
        uses: actions/checkout@11d5960a326750d5838078e36cf38b85af677262 # v4.4.0
        with:
          # Do not leave the token in .git/config. This job holds contents: write and then runs
          # `npm ci` over third-party packages; --ignore-scripts stops their lifecycle hooks, but
          # there is no reason to leave a second copy of the credential on disk for anything else
          # in the dependency tree to find. Nothing here needs it: every git call is local, and gh
          # authenticates from GH_TOKEN in the environment.
          persist-credentials: false

      # The tooling, carried in this file. This is what makes the workflow self-contained: there
      # is no second repository to reach, so nothing here depends on org Actions policy, on the
      # tooling repository's visibility, or on a token that can read it.
      - name: Unpack the inventory tooling
        run: |
          set -euo pipefail
          # $GITHUB_ENV only affects LATER steps, so this step sets its own copies too.
          TOOLS="$RUNNER_TEMP/inventory-tools"
          OUT="$RUNNER_TEMP/inventory-out"
          echo "TOOLS=$TOOLS" >> "$GITHUB_ENV"
          echo "OUT=$OUT" >> "$GITHUB_ENV"
          mkdir -p "$TOOLS" "$OUT"
          base64 -d > "$RUNNER_TEMP/inventory-tooling.tgz" <<'INVENTORY_TOOLING_PAYLOAD'
