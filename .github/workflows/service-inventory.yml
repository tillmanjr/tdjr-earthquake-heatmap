          kjb2BejOPkfKI/pB5YH6SzqmACKh9YiyTV83rOBJDqwEZsEbkcGNnQtIhY+CkfXrjKSFwhy0am6J
          8i4U5nAOjGpOsuMQ10ZQGjh3xivpSlz6/VijULTwBO83Qlwe/TxqfK86KfRRl9GpbM8PAm2yHGdU
          XemPa3tXvHlXPVp5zroWHq7smyIDxZCtUkONdsKANYtnp+aGp6+5ZHhvUXqOP65L9qelzBcBEyDb
          qGY122gc2JdMs7nqp7sP165wRTIk1uypisXT5+nz9Hn6PH2ePk+fp8/T5+nz9Hn6PH2ePk+fp8/T
          5+nz9Hn6PH2ePk+fp8/T5+nz9Hn6PH2ePk+fp8/T5+nz9Hn6PH3+63/+L6OkMMIAMAIA
          INVENTORY_TOOLING_PAYLOAD
          ACTUAL=$(sha256sum < "$RUNNER_TEMP/inventory-tooling.tgz" | cut -d' ' -f1)
          if [ "$ACTUAL" != "f361e9c3c90b25481d9a22c61a145c7aba019a49c03209a945aae9d6ad0cdce1" ]; then
            echo "::error::embedded payload digest mismatch: expected f361e9c3c90b25481d9a22c61a145c7aba019a49c03209a945aae9d6ad0cdce1, got $ACTUAL"
            exit 1
          fi
          tar -xzf "$RUNNER_TEMP/inventory-tooling.tgz" -C "$TOOLS"
          python3 -c "import ast,pathlib,sys; ns=sorted(pathlib.Path(sys.argv[1]).glob('*.py')); [ast.parse(p.read_text()) for p in ns]; print('tooling parses:', ', '.join(p.name for p in ns))" "$TOOLS/tools"

      - name: Discover platform and deployables
        id: d
        run: |
          python3 "$TOOLS/tools/discover_deployables.py" \
            --root . --platform "$PLATFORM_IN" >> "$GITHUB_OUTPUT"

      - name: Setup Node.js
        if: steps.d.outputs.platform == 'node'
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version-file: ${{ steps.d.outputs.node_version_file }}
          # setup-node hard-fails with "Dependencies lock file is not found" when caching is on
          # and no lockfile exists — before the continue-on-error install, so a lockfile-less Node
          # repo would publish nothing at all rather than a report with a recorded gap.
          cache: ${{ (hashFiles('**/package-lock.json', '**/npm-shrinkwrap.json') != '') && 'npm' || '' }}

      # The CodeGraph and Claude CLIs are npm-installed, so Node must exist even on a .NET repo —
      # but only when analysis is enabled, since both installs are gated on it and the
      # deterministic pass for a .NET repo is python and dotnet only.
      - name: Setup Node.js (for tooling)
        if: ${{ steps.d.outputs.platform != 'node' && github.event.inputs.enable_analysis == 'true' }}
        uses: actions/setup-node@49933ea5288caeca8642d1e84afbd3f7d6820020 # v4.4.0
        with:
          node-version: '24'

      - name: Setup .NET
        if: steps.d.outputs.platform == 'dotnet'
        uses: actions/setup-dotnet@67a3573c9a986a3f9c594539f4ab511d57bb3ce9 # v4.3.1
        with:
          dotnet-version: ${{ steps.d.outputs.dotnet_version }}

      # GITHUB_TOKEN reads org packages for both ecosystems — no PAT, nothing to rotate. A failure
      # here degrades the inventory (licence and vulnerability layers) rather than failing the run.
      - name: Install dependencies (node)
        if: steps.d.outputs.platform == 'node'
        continue-on-error: true
        env:
          NODE_AUTH_TOKEN: ${{ secrets.GITHUB_TOKEN }}
        # --ignore-scripts: this pass only reads manifests, the lockfile and audit/licence data,
        # so no dependency needs to build. Without it a compromised package's postinstall runs
        # with GH_TOKEN in the environment, which this job holds at contents: write.
        run: npm ci --no-audit --no-fund --ignore-scripts

      - name: Restore dependencies (dotnet)
        if: steps.d.outputs.platform == 'dotnet'
        continue-on-error: true
        run: |
          # --store-password-in-clear-text writes the token into ~/.nuget/NuGet/NuGet.Config.
          # The default shell is `bash -e`, so a failing restore would skip the cleanup and leave
          # it there for the rest of the job. A trap removes it on any exit path.
          trap 'dotnet nuget remove source gh-inventory >/dev/null 2>&1 || true' EXIT
          dotnet nuget add source "https://nuget.pkg.github.com/${{ github.repository_owner }}/index.json" \
            --username "${{ github.actor }}" --password "${{ secrets.GITHUB_TOKEN }}" \
            --store-password-in-clear-text --name gh-inventory
          dotnet restore

      # The rolling release is also the state store: the previous run's findings are pulled from
      # it to compute new/resolved, so that signal does not depend on artifact retention.
      # Ephemeral index of this checkout, discarded with the job. Never written to the service
      # repository, and a repo having no index of its own is not a finding. Gated on analysis
      # because the index has exactly one consumer: the model, through codegraph_explore.
      - name: Build CodeGraph index
        if: ${{ github.event.inputs.enable_analysis == 'true' }}
        continue-on-error: true
        run: |
          npm install -g @colbymchenry/codegraph
          codegraph init .

      - name: Install Claude CLI
        if: ${{ github.event.inputs.enable_analysis == 'true' }}
        run: npm install -g @anthropic-ai/claude-code

      - name: Fetch previous findings from the rolling release
        run: |
          mkdir -p "$OUT/prior"
          if gh release view "$TAG" >/dev/null 2>&1; then
            gh release download "$TAG" --dir "$OUT/prior" --pattern 'findings-*.json' || true
          fi
          echo "prior findings available: $(ls "$OUT/prior" 2>/dev/null | wc -l)"

      - name: Inventory each deployable
        env:
          DEPLOYABLES_JSON: ${{ steps.d.outputs.deployables }}
        run: |
          set -euo pipefail
          mkdir -p "$OUT/publish"
          # Through the environment, never interpolated into the script. A deployable name is
          # derived from a directory name; one containing a quote would otherwise close the shell
          # literal, at best breaking the step and at worst injecting shell.
          printf '%s' "$DEPLOYABLES_JSON" \
            | python3 -c 'import json,sys; [print(json.dumps(d)) for d in json.load(sys.stdin)]' \
            > "$OUT/deployables.jsonl"

          while IFS= read -r D; do
            NAME=$(printf '%s' "$D" | python3 -c 'import json,sys; print(json.load(sys.stdin)["name"])')
            WORK="$OUT/work/$NAME"; mkdir -p "$WORK"
            echo "::group::$NAME"

            python3 "$TOOLS/tools/collect.py" \
              --root . --platform '${{ steps.d.outputs.platform }}' \
              --deployable "$D" --repo "$GITHUB_REPOSITORY" --commit "$GITHUB_SHA" \
              --out "$WORK/collected.json"

            AGENT=()
            if [ "$ANALYSIS" = 'true' ]; then
              if python3 "$TOOLS/tools/run_analysis.py" \
                   --tools "$TOOLS" --root . --platform '${{ steps.d.outputs.platform }}' \
                   --deployable "$D" --collected "$WORK/collected.json" \
                   --task-timeout "$TASK_TIMEOUT" \
                   --out "$WORK/agent-findings.json"; then
                AGENT=(--agent "$WORK/agent-findings.json")
              else
                # SPEC.md section 5: a requested stage that cannot run is an operator error, not
                # a condition to degrade around. run_analysis exits non-zero only when it cannot
                # authenticate or crashes — every task-level failure is absorbed internally and
                # still exits 0 — so this repeats identically every run rather than being flaky.
                #
                # Fail here, before anything is published. Publishing a document without the half
                # that was asked for would overwrite a complete one under the same name, archive
                # the thin version as this commit's permanent record, and hand the next run a
                # degraded baseline. Publishing nothing leaves the previous inventory in place,
                # visibly stale, which is recoverable.
                echo "::error::analysis was requested for $NAME but could not run; check that an" \
                     "authenticated claude CLI is on PATH. Nothing has been published."
                exit 1
              fi
            fi

            PRIOR=()
            [ -f "$OUT/prior/findings-$NAME.json" ] && PRIOR=(--prior "$OUT/prior/findings-$NAME.json")
            BASE=()
            [ -f .github/service-inventory-baseline.json ] \
              && BASE=(--baseline .github/service-inventory-baseline.json)

            # Degrade rather than fail. Without this, one deployable's render error kills the step
            # under `set -e`, the publish step never runs, and NOTHING is published — including
            # deployables that already rendered.
            if python3 "$TOOLS/tools/build_report.py" \
                 --collected "$WORK/collected.json" \
                 ${AGENT[@]+"${AGENT[@]}"} ${PRIOR[@]+"${PRIOR[@]}"} ${BASE[@]+"${BASE[@]}"} \
                 --provenance ci --out-dir "$OUT/publish"; then
              cat "$OUT/publish/summary.md" >> "$OUT/summary-all.md"
            else
              echo "::warning::render failed for $NAME — other deployables are unaffected"
              echo "### \`$NAME\` — **render failed**, no report produced" >> "$OUT/summary-all.md"
              echo "$NAME" >> "$OUT/failed-deployables.txt"
            fi
            echo >> "$OUT/summary-all.md"
            echo "::endgroup::"
          done < "$OUT/deployables.jsonl"

      - name: Write metadata
        env:
          DEPLOYABLES_JSON: ${{ steps.d.outputs.deployables }}
        run: |
          printf '{"repo":"%s","sha":"%s","ref":"%s","runId":"%s","builtAt":"%s","toolingRev":"%s","deployables":%s}\n' \
            "$GITHUB_REPOSITORY" "$GITHUB_SHA" "$GITHUB_REF_NAME" "$GITHUB_RUN_ID" \
            "$(date -u +%Y-%m-%dT%H:%M:%SZ)" 'ab44cec-dirty' \
            "$DEPLOYABLES_JSON" > "$OUT/publish/meta.json"

      # One fixed tag reused every run, assets overwritten in place, never marked latest, and
      # nothing committed to the branch that built it — which would churn the SHA and can loop.
       # SPEC.md D1, D2, D9, D10. One fixed tag reused every run, assets overwritten in place,
      # never marked latest, and nothing committed to the branch that built it — which would churn
      # the SHA and can loop.
      - name: Publish as rolling release asset
        env:
          # Whether discovery was overridden rather than run. A deployable left out of an override
          # has not been removed from the repository, so such a run is not authoritative (D4).
          OVERRIDDEN: ${{ steps.d.outputs.overridden }}
        run: |
          set -euo pipefail

          # One place where anything is deleted, so the guards above it cannot drift apart and
          # a refusal is handled identically wherever it happens. Returns non-zero when the
          # delete did not happen, which is what keeps the reported counts honest (I9).
          delete_asset() {
            if gh release delete-asset "$TAG" "$1" --yes; then
              return 0
            fi
            echo "::warning::could not delete $1"
            return 1
          }

          # D1 — claim the release. The marker lives in the body rather than in an asset: it cannot
          # be pruned, costs nothing against the asset cap, and a human looking at the release can
          # see it. A release without it was not created here, so this run will not touch it, and
          # every later step may assume every asset present is one this workflow put there.
          MARKER='<!-- managed-by: svh-service-inventory -->'
          if BODY=$(gh release view "$TAG" --json body --jq .body 2>/dev/null); then
            # A body edited through the web UI comes back CRLF-terminated, and `grep -x` then
            # never matches the marker line — the workflow would refuse its own release.
            printf '%s\n' "$BODY" | tr -d '\r' > "$OUT/release-body.txt"
            if ! grep -qxF "$MARKER" "$OUT/release-body.txt"; then
              echo "::error::release $TAG was not created by this workflow, so publishing to it" \
                   "could destroy assets it does not own. Point release_tag at a tag this workflow" \
                   "owns, or add the line $MARKER to the release body to adopt it deliberately."
              exit 78
            fi
          else
            printf '%s\n%s\n\n%s\n' \
              "Rolling service inventory — outbound calls, inbound surface, and bill of materials." \
              "Auto-updated on merge; not a source release." \
              "$MARKER" > "$OUT/release-notes.md"
            gh release create "$TAG" \
              --title "Service inventory" \
              --notes-file "$OUT/release-notes.md" \
              --latest=false
          fi

          # D2 — an immutable copy of each file, keyed to this commit. The archive- PREFIX is
          # load-bearing: the previous findings are fetched with --pattern 'findings-*.json', and a
          # suffix scheme would be caught by that glob, feeding the whole archive back as the prior.
          rm -rf "$OUT/archive"
          mkdir -p "$OUT/archive"
          for f in "$OUT"/publish/*; do
            [ -e "$f" ] || continue
            cp "$f" "$OUT/archive/archive-$GITHUB_SHA-$(basename "$f")"
          done

          # D3 — the release as it is now: every asset with its publication time. Retention orders
          # by publication time rather than commit date, so a commit someone deliberately
          # re-published moves to the back of the deletion queue rather than being dropped next.
          gh release view "$TAG" --json assets --jq '.assets[] | [.createdAt, .name] | @tsv' \
            > "$OUT/on-release.tsv"

          # D4 — authority. Only an authoritative run may conclude a deployable is GONE rather than
          # merely absent from this run. Nothing below deletes anything yet; this is the flag the
          # deletion steps will consult, computed here so it is testable on its own.
          AUTHORITATIVE=1
          IS_HEAD=0
          HEAD_SHA=$(gh api "repos/$GITHUB_REPOSITORY/branches/$GITHUB_REF_NAME" \
                       --jq .commit.sha 2>/dev/null || true)
          if [ -z "$HEAD_SHA" ]; then
            # Failing to look the head up is not the same as being behind it, and reporting it as
            # "not the head" would hide a broken lookup behind a routine-looking notice.
            echo "::warning::head of $GITHUB_REF_NAME could not be determined; retiring nothing"
            AUTHORITATIVE=0
          elif [ "$HEAD_SHA" != "$GITHUB_SHA" ]; then
            echo "::notice::not the head of $GITHUB_REF_NAME; retiring nothing"
            AUTHORITATIVE=0
          else
            IS_HEAD=1
          fi
          if [ -f "$OUT/failed-deployables.txt" ]; then
            echo "::notice::a deployable did not render; retiring nothing"
            AUTHORITATIVE=0
          fi
          if [ "${OVERRIDDEN:-0}" = "1" ]; then
            echo "::notice::deployables were overridden; retiring nothing"
            AUTHORITATIVE=0
          fi
          echo "::notice::authoritative=$AUTHORITATIVE"

          # D5, D6 — retire what this workflow put on the release and no longer produces. Only
          # an authoritative run may conclude a name is stale rather than merely absent from this
          # run (D4), and a run that is not authoritative deletes nothing here at all (I4).
          #
          # No ownership test is needed: the release is one this workflow owns (D0), so an
          # unexpected current name is an earlier run's leftover, not somebody else's file.
          RETIRED=0
          if [ "$AUTHORITATIVE" = "1" ]; then
            find "$OUT/publish" -type f -exec basename {} \; | sort > "$OUT/current-names.txt"
            find "$OUT/archive" -type f -exec basename {} \; | sort > "$OUT/archive-names.txt"
            cut -f2 "$OUT/on-release.tsv" > "$OUT/on-release-names.txt"
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              case "$NAME" in
                "archive-$GITHUB_SHA-"*)
                  # D5 — this commit's own group. D7 protects the whole group from retention, so
                  # a member this run no longer produces would otherwise sit there forever, and
                  # one commit would accumulate assets nothing can ever remove.
                  grep -qxF "$NAME" "$OUT/archive-names.txt" && continue
                  ;;
                archive-*)
                  continue    # another commit's history. Retention decides its fate, not this.
                  ;;
                service-inventory-*.md|findings-*.json|summary.md|meta.json)
                  # D6 — a current name this run did not produce: a deployable that is gone.
                  grep -qxF "$NAME" "$OUT/current-names.txt" && continue
                  ;;
                *)
                  # Not a name this workflow publishes (D2). Owning the release does not mean
                  # this run created every shape on it, and deleting what it cannot account for
                  # buys nothing.
                  continue
                  ;;
              esac
              echo "::notice::retiring $NAME — this run no longer produces it"
              if delete_asset "$NAME"; then
                RETIRED=$((RETIRED+1))
              fi
            done < "$OUT/on-release-names.txt"
            if [ "$RETIRED" -gt 0 ]; then
              echo "::notice::retired $RETIRED asset(s) no longer produced"
              # The budget below is computed from the release, so it must see the release as it
              # is now rather than as it was before these deletions.
              gh release view "$TAG" --json assets --jq '.assets[] | [.createdAt, .name] | @tsv' \
                > "$OUT/on-release.tsv"
            fi
          fi

          # D7, D8 — prune BEFORE uploading. GitHub enforces the 1000-asset cap during the upload
          # itself, so a prune that ran afterwards could never help: the upload is what fails and
          # the prune is never reached.
          #
          # What is about to arrive counts against the budget too. Current names usually overwrite
          # rather than add, but a new or renamed deployable adds one, and near the cap that upload
          # is the first thing to fail.
          # Read the names from a FILE, never a pipeline. `grep -q` exits at the first match, so
          # on a release large enough to fill the pipe buffer `cut` dies of SIGPIPE, pipefail turns
          # that into 141, and the `||` counts a file that is already on the release as incoming --
          # pruning history the budget never needed to free. Measured on a 1000-name list: 5/5.
          cut -f2 "$OUT/on-release.tsv" > "$OUT/on-release-names.txt"
          INCOMING=0
          for f in "$OUT"/publish/* "$OUT"/archive/*; do
            [ -e "$f" ] || continue
            grep -qxF "$(basename "$f")" "$OUT/on-release-names.txt" || INCOMING=$((INCOMING+1))
          done

          # Deletions fail. A burst of sequential deletes is exactly what secondary rate limiting
          # throttles, so this is an ordinary path, not a rare one. Ignoring a failure would break
          # the cap invariant; aborting on the first would leave this commit unpublished and the
          # next run failing identically. So converge instead: delete, re-read, and if it still
          # does not fit, select more. Bounded, because an unbounded retry against a persistent
          # failure is an outage rather than a recovery.
          case "$RETENTION_TARGET" in
            ''|*[!0-9]*)
              echo "::error::retention_target must be a whole number; got '$RETENTION_TARGET'"
              exit 75
              ;;
          esac
          if [ "$RETENTION_TARGET" -gt 1000 ]; then
            # Above the hard cap the pruner correctly selects nothing while the convergence check
            # can never pass, so the run would refuse forever once the release filled.
            echo "::warning::retention_target $RETENTION_TARGET is above GitHub's hard cap; using 1000"
            RETENTION_TARGET=1000
          fi

          HEAD_FLAG=()
          [ "$IS_HEAD" = "1" ] && HEAD_FLAG=(--head)
          DELETED=0
          CONVERGED=0
          for PASS in 1 2 3; do
            if ! python3 "$TOOLS/tools/prune_release_assets.py" \
                 --assets "$OUT/on-release.tsv" --target "$RETENTION_TARGET" \
                 --incoming "$INCOMING" --protect "$GITHUB_SHA" \
                 ${HEAD_FLAG[@]+"${HEAD_FLAG[@]}"} \
                 > "$OUT/prune.txt" 2> "$OUT/prune-error.txt"; then
              # Surface the pruner's own reason. The generic sentence is the difference between
              # an operator knowing which remedy applies and guessing.
              echo "::error::$(tr '\n' ' ' < "$OUT/prune-error.txt")"
              echo "::error::nothing was uploaded"
              exit 75
            fi
            while IFS= read -r NAME; do
              [ -n "$NAME" ] || continue
              if delete_asset "$NAME"; then
                DELETED=$((DELETED+1))
              fi
            done < "$OUT/prune.txt"
            gh release view "$TAG" --json assets --jq '.assets[] | [.createdAt, .name] | @tsv' \
              > "$OUT/on-release.tsv"
            cut -f2 "$OUT/on-release.tsv" > "$OUT/on-release-names.txt"
            ON_RELEASE=$(grep -c . "$OUT/on-release.tsv" || true)
            [ "$PASS" -eq 1 ] || echo "::notice::prune pass $PASS left $ON_RELEASE asset(s)"
            if [ "$((ON_RELEASE + INCOMING))" -le 1000 ]; then
              CONVERGED=1
              break
            fi
          done
          if [ "$CONVERGED" != "1" ]; then
            echo "::error::still over the 1000-asset cap after 3 passes; nothing was uploaded"
            exit 75
          fi
          # I9 — report what was deleted, never what was selected. The two differ exactly when a
          # delete failed, which is when the number is worth reading.
          [ "$DELETED" -eq 0 ] || echo "::notice::pruned $DELETED asset(s) to stay under the cap"

          # D9 — current names first; they are the stable link a reader follows.
          gh release upload "$TAG" "$OUT"/publish/* --clobber
          gh release upload "$TAG" "$OUT"/archive/* --clobber
          echo "::notice::published $(find "$OUT/publish" -type f | wc -l | tr -d ' ') file(s)," \
               "archived as archive-$GITHUB_SHA-*"

          # D10, D11 — a deployable that did not render produced no files, so it was never in the
          # publish set. Name it and exit 70: what was produced is published, and the run is not a
          # success. Reported after the upload because the upload is what the run is for.
          if [ -f "$OUT/failed-deployables.txt" ]; then
            FAILED=$(tr '\n' ' ' < "$OUT/failed-deployables.txt")
            echo "::error::these deployables did not render and were not published: $FAILED"
            exit 70
          fi

      # Convenience copy attached to the run. The release asset above is the durable record.
      - name: Upload run artifact
        uses: actions/upload-artifact@ea165f8d65b6e75b540449e92b4886f43607fa02 # v4.6.2
        with:
          name: service-inventory
          path: ${{ env.OUT }}/publish/

      - name: Job summary
        if: always()
        run: |
          {
            echo "## Service inventory"
            echo
            echo "Published to release \`$TAG\` — [assets](${{ github.server_url }}/${{ github.repository }}/releases/tag/$TAG)"
            echo
            cat "$OUT/summary-all.md" 2>/dev/null || echo "_no summary produced_"
          } >> "$GITHUB_STEP_SUMMARY"
